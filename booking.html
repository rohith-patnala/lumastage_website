<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" sizes="96x96" href="assets/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173F4A"><title>Book a Visit | LumaStage</title><link rel="stylesheet" href="assets/global.css">
<link rel="stylesheet" href="assets/booking.css"><link rel="stylesheet" href="assets/requested-fixes.css">
<script src="https://unpkg.com/lucide@latest"></script><script defer src="assets/site.js"></script></head><body class="booking-page"><div class="booking-tools"><button class="btn btn-primary header-control" data-mode-toggle aria-label="Toggle dark mode"><i data-lucide="moon"></i></button><button class="btn btn-primary header-control" data-rtl-toggle aria-label="Toggle RTL"><span class="rtl-label">RTL</span></button></div><main class="booking-wrap"><a class="brand booking-brand" href="index.html" aria-label="LumaStage home"><img class="brand-symbol" src="assets/theatre-logo-light.png" alt="LumaStage emblem"><span class="brand-copy"><span class="brand-name">Luma<span>Stage</span></span><span class="brand-subtitle">Immersive Living, Refined</span></span></a><h1>Book a Visit</h1><p class="booking-intro">Tell us a little about your space. We’ll arrange a consultation around your home theatre and audio goals.</p><form class="form-card" data-demo-form><div class="form-grid"><div class="field"><label for="full-name">Full name</label><input id="full-name" name="name" autocomplete="name" required placeholder="Your name"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" name="phone" autocomplete="tel" required placeholder="Your contact number"></div><div class="field"><label for="visit-type">Consultation type</label><select id="visit-type" name="consultation" required><option value="">Choose a consultation</option><option>Home theatre installation</option><option>Surround sound setup</option><option>Multi-room audio</option><option>AV upgrade and calibration</option></select></div><div class="field"><label for="date">Preferred date</label><input id="date" type="date" name="date" required></div><div class="field"><label for="budget">Approximate budget</label><select id="budget" name="budget"><option value="">Select budget range</option><option>Under ₹1,00,000</option><option>₹1,00,000–₹3,00,000</option><option>₹3,00,000–₹7,00,000</option><option>₹7,00,000+</option></select></div><div class="field full"><label for="details">Tell us about your room</label><textarea id="details" name="details" placeholder="Room size, existing equipment, goals or questions"></textarea></div></div><button class="btn btn-primary booking-submit" type="submit">Request consultation <i data-lucide="arrow-up-right"></i></button><p class="form-note form-status" aria-live="polite">Your details will help us prepare for the consultation.</p></form></main></body></html>
